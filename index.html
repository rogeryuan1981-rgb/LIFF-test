<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06c755">
  <title>小幫手｜服務查詢</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --green:#06c755; --green-dark:#05813a; --ink:#18302a; --muted:#61726b; --line:#d9e8e1; --wash:#f3faf7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; color:var(--ink); background:var(--wash); }
    .boot-screen { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:24px; background:var(--wash); opacity:1; visibility:visible; transition:opacity .18s ease,visibility .18s ease; }
    .boot-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .boot-card { display:grid; justify-items:center; gap:12px; color:var(--muted); text-align:center; }
    .boot-logo { display:grid; place-items:center; width:58px; height:58px; border-radius:19px; background:linear-gradient(145deg,var(--green),var(--green-dark)); color:white; font-size:22px; font-weight:900; box-shadow:0 12px 28px rgba(6,199,85,.22); }
    .boot-dots { display:flex; gap:5px; }
    .boot-dots i { width:7px; height:7px; border-radius:50%; background:#88a397; animation:bootPulse 1s infinite; }
    .boot-dots i:nth-child(2) { animation-delay:.14s; }
    .boot-dots i:nth-child(3) { animation-delay:.28s; }
    button,input { font:inherit; }
    main { width:min(100%,760px); min-height:100vh; margin:auto; padding:calc(18px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .brand { font-size:18px; font-weight:800; }
    .header-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
    .status { padding:7px 10px; border:1px solid #f0b8b0; border-radius:999px; background:#fff1ef; color:#a5392d; font-size:12px; }
    .status[hidden] { display:none; }
    .admin-link { display:inline-flex; align-items:center; min-height:38px; padding:0 12px; border-radius:10px; background:var(--ink); color:#fff; font-size:12px; font-weight:800; text-decoration:none; box-shadow:0 7px 18px rgba(24,48,42,.16); }
    .admin-link[hidden] { display:none; }
    .mode-switch { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; width:min(calc(100% - 32px),320px); margin:0 auto 24px; padding:4px; border:1px solid var(--line); border-radius:14px; background:#e7f2ed; }
    .mode-option { display:grid; place-items:center; min-height:42px; padding:8px 12px; border-radius:10px; color:var(--muted); font-size:13px; font-weight:800; text-align:center; text-decoration:none; }
    .mode-option.active { background:#fff; color:var(--green-dark); box-shadow:0 3px 12px rgba(22,72,55,.10); }
    h1 { margin:0 0 8px; font-size:clamp(30px,8vw,42px); letter-spacing:-.04em; }
    .lead { margin:0 0 20px; color:var(--muted); line-height:1.65; }
    .search { width:100%; min-height:56px; padding:0 18px; border:2px solid var(--line); border-radius:16px; background:white; color:var(--ink); outline:none; box-shadow:0 10px 28px rgba(22,72,55,.08); }
    .search:focus { border-color:var(--green); box-shadow:0 0 0 4px rgba(6,199,85,.12); }
    .browse-title { margin:26px 2px 11px; font-size:16px; }
    .category-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:22px; }
    .category-grid[hidden], .browse-title[hidden] { display:none; }
    .category-card { min-height:104px; padding:15px; border:1px solid var(--line); border-radius:17px; background:white; color:var(--ink); text-align:left; cursor:pointer; box-shadow:0 7px 22px rgba(22,72,55,.055); transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease; }
    .category-card:hover { border-color:#9ed9bd; transform:translateY(-2px); box-shadow:0 11px 28px rgba(22,72,55,.10); }
    .category-icon { display:block; margin-bottom:11px; font-size:22px; }
    .category-name { display:block; font-weight:800; }
    .category-count { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .result-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:22px 2px 10px; }
    .result-head[hidden] { display:none; }
    .result-head h2 { margin:0; font-size:16px; }
    .back-button { padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:white; color:var(--green-dark); cursor:pointer; font-size:12px; font-weight:700; }
    .results { display:grid; gap:11px; }
    details { overflow:hidden; border:1px solid var(--line); border-radius:17px; background:white; box-shadow:0 7px 22px rgba(22,72,55,.055); }
    summary { position:relative; padding:17px 46px 17px 17px; cursor:pointer; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"＋"; position:absolute; right:17px; top:50%; translate:0 -50%; color:var(--green-dark); font-size:22px; }
    details[open] summary::after { content:"−"; }
    .tag { display:block; margin-bottom:5px; color:var(--green-dark); font-size:11px; font-weight:800; letter-spacing:.06em; }
    .question { font-weight:800; line-height:1.45; }
    .answer { padding:0 17px 17px; border-top:1px solid #edf3f0; }
    .answer h3 { margin:15px 0 6px; font-size:14px; }
    .answer p { margin:0; color:#41534c; line-height:1.7; white-space:pre-line; }
    .empty { padding:32px 16px; border:1px dashed var(--line); border-radius:17px; background:white; color:var(--muted); text-align:center; }
    .finish-bar { position:fixed; z-index:8; left:50%; bottom:0; width:min(100%,760px); padding:10px 18px calc(10px + env(safe-area-inset-bottom)); translate:-50% 0; background:linear-gradient(180deg,rgba(243,250,247,0),rgba(243,250,247,.96) 24%); }
    .feedback-button { width:100%; min-height:52px; border:0; border-radius:15px; background:var(--green); color:white; font-weight:800; cursor:pointer; box-shadow:0 10px 22px rgba(6,199,85,.20); }
    footer { margin-top:18px; color:var(--muted); font-size:12px; line-height:1.6; text-align:center; }
    .modal-backdrop { position:fixed; inset:0; z-index:10; display:none; align-items:flex-end; justify-content:center; padding:18px; background:rgba(9,27,21,.46); }
    .modal-backdrop.show { display:flex; }
    .modal { width:min(100%,480px); padding:22px; border-radius:22px; background:white; box-shadow:0 24px 60px rgba(0,0,0,.24); }
    .modal h2 { margin:0 0 8px; font-size:22px; }
    .modal p { margin:0 0 18px; color:var(--muted); line-height:1.6; }
    .modal-actions { display:grid; gap:9px; }
    .modal-actions button { min-height:48px; border-radius:13px; cursor:pointer; font-weight:800; }
    .yes { border:0; background:var(--green); color:white; }
    .no { border:1px solid var(--green); background:white; color:var(--green-dark); }
    .cancel { border:0; background:#f0f4f2; color:var(--muted); }
    @keyframes bootPulse { 0%,70%,100% { opacity:.35; transform:translateY(0); } 35% { opacity:1; transform:translateY(-2px); } }
    @media (max-width:520px) { .header-actions { flex-wrap:wrap; } }
    @media (min-width:620px) { main { padding-inline:28px; } .modal-backdrop { align-items:center; } }
  </style>
</head>
<body>
<div id="bootScreen" class="boot-screen" role="status" aria-live="polite">
  <div class="boot-card">
    <div class="boot-logo" aria-hidden="true">幫</div>
    <div>正在連接 LINE 並確認使用權限…</div>
    <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>
<main>
  <header>
    <div class="brand">小幫手</div>
    <div class="header-actions">
      <a id="adminLink" class="admin-link" href="admin.html" hidden>管理中心</a>
      <div id="status" class="status" role="alert" hidden></div>
    </div>
  </header>

  <nav class="mode-switch" aria-label="查詢模式">
    <a class="mode-option active" href="index.html?mode=faq" aria-current="page">問答集模式</a>
    <a class="mode-option" href="conversation.html">對話引導</a>
  </nav>

  <h1 id="greetingTitle">服務問題查詢</h1>
  <p class="lead">輸入問題或關鍵字，查看常見處置方式。查詢內容不會保存。</p>
  <input id="search" class="search" type="search" placeholder="例如：辨識失敗、體溫、血壓、網路" autocomplete="off">
  <h2 id="browseTitle" class="browse-title">從哪一類開始？</h2>
  <div id="chips" class="category-grid" aria-label="問題分類"></div>

  <div id="resultHead" class="result-head" hidden>
    <h2 id="resultCount"></h2>
    <button id="resetButton" class="back-button" type="button">返回分類</button>
  </div>
  <section id="results" class="results" aria-live="polite"></section>

  <footer>如涉及個人資料、設備維修或個別案件，請回到 LINE@ 由客服協助。</footer>
</main>

<div class="finish-bar"><button id="feedbackButton" class="feedback-button" type="button">結束查詢</button></div>

<div id="feedbackModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
  <div class="modal">
    <h2 id="feedbackTitle">有找到需要的答案嗎？</h2>
    <p>選擇後會將您的暱稱、查詢問題與結果帶回 LINE@；若尚未解決，客服會接續協助。</p>
    <div class="modal-actions">
      <button class="yes" data-feedback="resolved">有，已經解決</button>
      <button class="no" data-feedback="unresolved">還沒有，需要客服</button>
      <button class="cancel" data-feedback="cancel">繼續查看</button>
    </div>
  </div>
</div>

<script>
  // 建立 LIFF App 後，請將 YOUR_LIFF_ID 換成實際的 LIFF ID。
  const LIFF_ID = "2011870813-C7Krkv36";
  const API_BASE = "https://customer-liff-webhook.rogeryuan1981.workers.dev";
  const SESSION_KEY = "helper-liff-session-v3";
  const SESSION_TTL = 15 * 60 * 1000;

  const faqs = [
    { category:"身分辨識", question:"長者辨識失敗、很難辨識，或沒有人卻喊出名字", keywords:["臉部辨識","人臉","空氣辨識","偵測不到"], answer:"1. 補傳未戴帽子、口罩或頭巾的清晰正面大頭照，並以 ZIP 或 RAR 壓縮檔寄送。\n2. 與機器人保持在 1 公尺內，五官完整出現在畫面框中。\n3. 刪除機器人內的舊版專案，避免版本衝突。" },
    { category:"身分辨識", question:"機器人叫錯長者的名字", keywords:["叫錯名字","辨識錯人","名字不對"], answer:"重新拍攝清晰正面照片並上傳後台，再進行模型重新訓練與派發。" },
    { category:"身分辨識", question:"機器人為什麼稱呼長者為「測試者」", keywords:["測試者","稱謂"], answer:"系統辨識失敗後，如果使用者選擇直接進入測量模式，機器人會以「測試者」稱呼。" },
    { category:"身分辨識", question:"一開始就出現「請靠近一點」的提示", keywords:["靠近一點","提示太早","語音"], answer:"工程團隊已調整提示語音的觸發時間與邏輯，避免長者剛就定位時過早播放提示。" },

    { category:"數據上傳", question:"量測完成後，資料沒有傳到文健站系統或後台", keywords:["沒有上傳","上傳失敗","資料未傳","文健站系統"], answer:"先確認人臉辨識成功，而且量測結束時有聽到「上傳成功」。未成功辨識者的資料不會上傳。\n文健站系統需提供授權帳密，完成 API 綁定串接。\n如果因連線異常暫時上傳失敗，請先手動補登。" },
    { category:"數據上傳", question:"後台看不到 AI 建立的生理量測簽核資料", keywords:["督導看不到","送審","簽核","後台未顯示"], answer:"AI 自動建立資料後，照服員仍需進入後台點選「編輯」，再手動按「送審」。完成後，負責人或督導端才會看到審核資料。" },

    { category:"生理量測", question:"體溫顯示 0 度，或體溫量測步驟被跳過", keywords:["體溫0","零度","沒有體溫","跳過體溫"], answer:"確認機器人頭頂的茶葉蛋造型溫度計是否插好。舊版溫度計還需確認電源插頭全程連接，且指示燈有亮起。" },
    { category:"生理量測", question:"機器人量到的體溫普遍偏高", keywords:["體溫偏高","發熱","額溫正常"], answer:"機器人插電使用時，機身與頭部發熱可能影響感測器。量測時請拔除電源線，無人使用時再充飽電。團隊也會持續記錄特定個案數值，以進行校正。" },
    { category:"生理量測", question:"AI 血壓和血壓機的數值差距很大或偏低", keywords:["血壓不準","血壓偏高","血壓偏低","數值落差"], answer:"請依資料彙整中的校正方式選擇用藥狀態：有服用高血壓藥物者選「高血壓前期」；未服藥者選「高血壓」；一般正常狀態選「正常」。正確選項有助演算法校正。" },
    { category:"生理量測", question:"第二次量測覆蓋第一次紀錄，而且沒有自動備註", keywords:["重複量測","覆蓋","自動備註","第二次"], answer:"目前版本尚未提供二次量測自動備註功能。請由照服員暫時手動輸入備註。" },

    { category:"機器人操作", question:"每次量測都要重新輸入身高、體重與年齡", keywords:["重複輸入","身高","體重","年齡","基本資料"], answer:"請先在後台完整建立長者基本資料。之後透過人臉辨識登入，系統就能自動帶入，不需每次重複輸入。" },
    { category:"機器人操作", question:"輸入基本資料後，系統說數值等於零", keywords:["數值等於零","小數點","身高體重為0"], answer:"身高與體重請輸入整數，不要輸入小數點。系統無法解析小數點時，會將數值判定為 0。" },
    { category:"機器人操作", question:"換下一位長者時，為什麼不能直接接著辨識", keywords:["下一位","切換長者","重新辨識","退出"], answer:"每位長者完成後都要先退出，再重新辨識下一位。若省略退出步驟，系統可能繼續使用上一位長者的資料。" },
    { category:"機器人操作", question:"畫面出現「未安裝指定 APP」", keywords:["未安裝指定APP","警告","繼續執行"], answer:"這是系統提醒。直接點選「繼續執行」即可，不會影響系統功能。" },
    { category:"機器人操作", question:"畫面卡住、叫不起來，或找不到操作選單", keywords:["卡住","主畫面","找不到選單","叫不起來","roflow"], answer:"可在螢幕上由右往左滑，或由上往下滑，回到選單後點選 roflow。\n也可按一下頭頂電源鍵，或長按電源鍵並選擇「退出 roflow」，再回到主選單。" },

    { category:"硬體與網路", question:"機器人的頭一直擺動", keywords:["擺頭","搖晃","頭一直動"], answer:"團隊規劃更換頭部較輕、並具備自動人臉追蹤功能的新版機器人。" },
    { category:"硬體與網路", question:"機器人頭部下垂，導致臉部難以對焦", keywords:["頭部下垂","脖子","對焦","抬頭"], answer:"從螢幕下拉選單關閉「動作控制」，或將動作設定為「不動」。" },
    { category:"硬體與網路", question:"機器人音量太大，要去哪裡調整", keywords:["音量","太大聲","聲音"], answer:"從下拉選單調整音量。如果選單遭鎖定，先長按頭頂按鈕，選擇「退出 roflow」，再下拉調整音量。" },
    { category:"硬體與網路", question:"畫面提示「環境要再亮一點」", keywords:["光線不足","環境亮一點","照明"], answer:"非接觸式影像量測需要充足光線。請移到光線充足的位置，例如面向自然光或照明良好處。" },
    { category:"硬體與網路", question:"機器人投影到電視需要 HDMI 線嗎", keywords:["投影","電視","HDMI","線材","無線"], answer:"機器人採用無線方式連接電視，不需要另外準備 HDMI 線材。若仍無法連接，可向客服索取示範影片。" },
    { category:"硬體與網路", question:"現場網路不穩，機器人無法順利量測或上傳", keywords:["網路不穩","斷線","延遲","熱點","連不上網"], answer:"非接觸式影像檢測需要穩定且頻寬充足的網路。請先檢查現場訊號；若網路異常，可暫時改連手機熱點測試。" },
    { category:"硬體與網路", question:"使用 CHT7656 網路時，資料疑似遭防火牆阻擋", keywords:["CHT7656","防火牆","封包","網域"], answer:"此問題需由團隊協調原民會與電信業者，調整站點 CHT7656 網域的防火牆及連線設定，請回到 LINE@ 聯繫客服。" },

    { category:"行政與帳務", question:"為什麼系統串接需要提供照服員帳號密碼", keywords:["照服員帳密","帳號密碼","授權","API"], answer:"提供授權帳密是系統自動串接文健站平台的必要步驟，用於完成 API 綁定。" },
    { category:"行政與帳務", question:"專案結束後，電視與機器人會被回收嗎", keywords:["設備回收","財產","財編","專案結束"], answer:"專案結束後，電視與機器人會永久留在文健站使用，不會回收。" },
    { category:"行政與帳務", question:"雲端手冊或簡報無法直接在線上開啟", keywords:["雲端手冊","簡報打不開","檔案無法開啟","下載"], answer:"開啟雲端連結後，點選「更多動作」，再選擇「下載」。將簡報儲存到電腦資料夾後，再從本機開啟。" },
    { category:"行政與帳務", question:"量測資料沒有即時推播到長者 LINE", keywords:["LINE推播","沒有收到訊息","Token","額度"], answer:"資料彙整中的案例原因是訊息 Token 額度用盡。由計畫主持人完成核銷及付費程序後，即可恢復推播。" }
  ];

  const search = document.querySelector("#search");
  const chips = document.querySelector("#chips");
  const results = document.querySelector("#results");
  const resultCount = document.querySelector("#resultCount");
  const resultHead = document.querySelector("#resultHead");
  const browseTitle = document.querySelector("#browseTitle");
  const statusBox = document.querySelector("#status");
  const bootScreen = document.querySelector("#bootScreen");
  const adminLink = document.querySelector("#adminLink");
  const greetingTitle = document.querySelector("#greetingTitle");
  const modal = document.querySelector("#feedbackModal");
  let selectedCategory = null;
  let lastViewedQuestion = "未指定問題";
  let userDisplayName = "";

  function readSessionCache() {
    try {
      const cached = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
      if (!cached || cached.expiresAt <= Date.now()) {
        sessionStorage.removeItem(SESSION_KEY);
        return null;
      }
      return cached;
    } catch {
      sessionStorage.removeItem(SESSION_KEY);
      return null;
    }
  }

  function writeSessionCache(patch) {
    const current = readSessionCache() || {};
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      ...current,
      ...patch,
      expiresAt: Date.now() + SESSION_TTL
    }));
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  }

  function createCategoryButtons() {
    const categories = [...new Set(faqs.map(item => item.category))];
    const icons = { "身分辨識":"◉", "數據上傳":"↥", "生理量測":"♡", "機器人操作":"▣", "硬體與網路":"⌁", "行政與帳務":"▤" };
    chips.innerHTML = categories.map(category => `
      <button class="category-card" data-category="${escapeHtml(category)}">
        <span class="category-icon" aria-hidden="true">${icons[category] || "•"}</span>
        <span class="category-name">${escapeHtml(category)}</span>
        <span class="category-count">${faqs.filter(item => item.category === category).length} 個常見問題</span>
      </button>
    `).join("");
  }

  function render() {
    const keyword = search.value.trim().toLocaleLowerCase("zh-Hant");
    const hasSelection = Boolean(keyword || selectedCategory);

    resultHead.hidden = !hasSelection;
    browseTitle.hidden = hasSelection;
    chips.hidden = hasSelection;

    if (!hasSelection) {
      results.innerHTML = "";
      return;
    }

    const filtered = faqs.filter(item => {
      const categoryMatch = !selectedCategory || item.category === selectedCategory;
      const text = [item.question, item.answer, ...item.keywords].join(" ").toLocaleLowerCase("zh-Hant");
      return categoryMatch && (!keyword || text.includes(keyword));
    });

    resultCount.textContent = selectedCategory
      ? `${selectedCategory}・${filtered.length} 筆`
      : `搜尋結果・${filtered.length} 筆`;
    results.innerHTML = filtered.length ? filtered.map((item, index) => `
      <details data-question="${escapeHtml(item.question)}">
        <summary>
          <span class="tag">${escapeHtml(item.category)}</span>
          <span class="question">${escapeHtml(item.question)}</span>
        </summary>
        <div class="answer">
          <h3>處置方式</h3>
          <p>${escapeHtml(item.answer)}</p>
        </div>
      </details>
    `).join("") : `<div class="empty">找不到符合的問題。<br>請更換關鍵字，或回到 LINE@ 詢問客服。</div>`;
  }

  chips.addEventListener("click", event => {
    const button = event.target.closest("[data-category]");
    if (!button) return;
    selectedCategory = button.dataset.category;
    render();
  });

  search.addEventListener("input", render);
  document.querySelector("#resetButton").addEventListener("click", () => {
    selectedCategory = null;
    search.value = "";
    render();
    search.focus();
  });
  results.addEventListener("toggle", event => {
    if (event.target.open && event.target.dataset.question) lastViewedQuestion = event.target.dataset.question;
  }, true);

  function openFeedback() { modal.classList.add("show"); }
  document.querySelector("#feedbackButton").addEventListener("click", openFeedback);
  modal.addEventListener("click", event => {
    if (event.target === modal) modal.classList.remove("show");
  });

  async function returnToLine(result) {
    const resolved = result === "resolved";
    const salutation = userDisplayName ? `${userDisplayName}，` : "";
    const responseText = resolved
      ? `${salutation}感謝提問，很高興幫到您！`
      : `${salutation}抱歉沒有解答到您，我們立刻呼叫客服來協助您。`;
    const message = `${resolved ? "✅ 已獲得解答" : "❓ 需要客服協助"}\n${responseText}\n查詢問題：${lastViewedQuestion}`;
    try {
      if (window.liff && liff.isInClient()) {
        await liff.sendMessages([{ type:"text", text:message }]);
        liff.closeWindow();
        return;
      }
      if (navigator.clipboard) await navigator.clipboard.writeText(message);
      alert("目前不在 LINE 內開啟。回覆內容已複製，請貼到 LINE@ 對話。\n\n" + message);
    } catch (error) {
      console.error(error);
      alert("無法自動送出訊息，請回到 LINE@ 手動輸入：\n" + message);
    }
  }

  modal.querySelectorAll("[data-feedback]").forEach(button => {
    button.addEventListener("click", () => {
      const result = button.dataset.feedback;
      modal.classList.remove("show");
      if (result !== "cancel") returnToLine(result);
    });
  });

  async function detectAdmin(currentUserId) {
    const cached = readSessionCache();
    if (cached?.userId === currentUserId && typeof cached?.isAdmin === "boolean") {
      adminLink.hidden = !cached.isAdmin;
      return;
    }

    const idToken = liff.getIDToken();
    if (!idToken) return;

    try {
      const response = await fetch(`${API_BASE}/api/me`, {
        headers: { Authorization:`Bearer ${idToken}` }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
      const isAdmin = Boolean(data.isAdmin);
      adminLink.hidden = !isAdmin;
      writeSessionCache({ userId:data.viewer?.userId || currentUserId, displayName:data.viewer?.displayName || userDisplayName, isAdmin });
    } catch (error) {
      console.warn("無法確認管理員身分。", error);
      adminLink.hidden = true;
    }
  }

  async function initializeLiff() {
    if (LIFF_ID === "YOUR_LIFF_ID" || !window.liff) {
      bootScreen.classList.add("hidden");
      return;
    }
    let redirecting = false;
    try {
      await liff.init({ liffId:LIFF_ID });
      if (!liff.isLoggedIn()) {
        redirecting = true;
        liff.login({ redirectUri:location.href });
        return;
      }
      const tokenInfo = liff.getDecodedIDToken();
      const cached = readSessionCache();
      const currentUserId = tokenInfo?.sub || "";
      userDisplayName = ((cached?.userId === currentUserId ? cached.displayName : "") || tokenInfo?.name || "").trim();
      if (userDisplayName) writeSessionCache({ userId:currentUserId, displayName:userDisplayName });
      if (userDisplayName) greetingTitle.textContent = `嗨，${userDisplayName}`;
      await detectAdmin(currentUserId);
    } catch (error) {
      console.error(error);
      statusBox.textContent = "LINE 連線失敗，請重新開啟";
      statusBox.hidden = false;
    } finally {
      if (!redirecting) bootScreen.classList.add("hidden");
    }
  }

  createCategoryButtons();
  render();
  initializeLiff();
</script>
</body>
</html>
