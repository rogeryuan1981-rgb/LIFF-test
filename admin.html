<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13263f">
  <title>客服(LIFF)｜客服管理中心</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --navy:#13263f; --navy-2:#1d3b61; --ink:#192433; --muted:#6b7788;
      --line:#dfe5ec; --surface:#fff; --bg:#f4f7fa; --danger:#b42318;
      --shadow:0 8px 28px rgba(19,38,63,.08);
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif; }
    button,input,select { font:inherit; }
    .shell { width:min(960px,100%); margin:auto; padding:20px 16px 48px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:linear-gradient(145deg,var(--navy-2),var(--navy)); color:#fff; font-weight:800; box-shadow:var(--shadow); }
    h1,h2 { margin:0; }
    h1 { font-size:20px; }
    h2 { font-size:17px; }
    .subtitle,.hint { color:var(--muted); font-size:13px; line-height:1.6; }
    .subtitle { margin:3px 0 0; }
    .viewer { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
    .viewer[hidden] { display:none; }
    .viewer img { width:32px; height:32px; border-radius:50%; object-fit:cover; }
    .tabs { display:flex; gap:5px; margin-bottom:14px; padding:5px; border:1px solid var(--line); border-radius:14px; background:#e9eef4; }
    .tab { flex:1; min-height:42px; border:0; border-radius:10px; background:transparent; color:var(--muted); font-weight:800; cursor:pointer; }
    .tab.active { background:#fff; color:var(--navy); box-shadow:0 3px 12px rgba(19,38,63,.10); }
    .tab-panel[hidden] { display:none; }
    .panel { border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow); }
    .toolbar { display:grid; grid-template-columns:minmax(0,1fr) 130px minmax(180px,.55fr) auto; gap:10px; padding:14px; margin-bottom:14px; }
    input,select { width:100%; min-height:44px; padding:0 13px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); outline:none; }
    input:focus,select:focus { border-color:#7ba3cf; box-shadow:0 0 0 3px rgba(29,59,97,.10); }
    .button { min-height:42px; padding:0 14px; border:0; border-radius:11px; background:var(--navy); color:#fff; font-weight:700; cursor:pointer; }
    .button.secondary { border:1px solid var(--line); background:#fff; color:var(--navy-2); }
    .button.danger { border:1px solid #f0b9b3; background:#fff; color:var(--danger); }
    .button:disabled { opacity:.45; cursor:default; }
    .status { margin:0 0 12px; padding:12px 14px; border-radius:12px; background:#eaf2fb; color:var(--navy-2); font-size:14px; }
    .status.error { background:#fff0ee; color:var(--danger); }
    .status[hidden] { display:none; }
    .count-line { margin:0 2px 10px; color:var(--muted); font-size:13px; }
    .count-line[hidden] { display:none; }
    .message-list { overflow:hidden; }
    .message { display:grid; grid-template-columns:42px minmax(0,1fr); gap:12px; padding:16px; border-bottom:1px solid var(--line); }
    .message:last-child { border-bottom:0; }
    .avatar { display:grid; place-items:center; width:42px; height:42px; border-radius:50%; background:#e6edf5; color:var(--navy-2); font-weight:800; object-fit:cover; }
    .message-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:7px; }
    .sender,.name { font-weight:800; }
    .conversation { margin-top:2px; color:var(--muted); font-size:13px; }
    .kind { display:inline-block; margin-right:6px; padding:2px 7px; border-radius:999px; background:#eaf2fb; color:var(--navy-2); font-size:11px; font-weight:700; }
    time { color:var(--muted); font-size:12px; white-space:nowrap; }
    .message-text { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.6; }
    .message-type { display:inline-block; padding:5px 9px; border-radius:999px; background:#eef2f6; color:var(--muted); font-size:12px; }
    .empty { padding:34px 16px; color:var(--muted); text-align:center; }
    .footer-actions { display:flex; justify-content:center; padding:16px 0 0; }
    .permissions-grid { display:grid; gap:14px; }
    .permissions-panel { padding:16px; }
    .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .badge-count { min-width:28px; padding:4px 8px; border-radius:999px; background:#eaf2fb; color:var(--navy-2); font-size:12px; font-weight:800; text-align:center; }
    .manual-form { display:grid; grid-template-columns:minmax(0,1fr) minmax(140px,.45fr) auto; gap:9px; margin-bottom:14px; }
    .people { display:grid; gap:8px; }
    .person { display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:11px; padding:11px; border:1px solid var(--line); border-radius:14px; }
    .person .avatar { width:44px; height:44px; }
    .uid { margin-top:3px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; overflow-wrap:anywhere; }
    .self { display:inline-block; margin-left:6px; padding:2px 6px; border-radius:999px; background:#e8f9ef; color:#08783a; font-size:11px; }
    .candidate-search { margin-bottom:10px; }
    .settings-panel { padding:18px; }
    .setting-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:16px 0; }
    .setting-option { position:relative; display:block; padding:16px; border:1px solid var(--line); border-radius:15px; cursor:pointer; }
    .setting-option:has(input:checked) { border-color:var(--navy-2); background:#eef4fb; box-shadow:0 0 0 2px rgba(29,59,97,.08); }
    .setting-option input { position:absolute; width:1px; height:1px; opacity:0; }
    .setting-option strong { display:block; margin-bottom:5px; color:var(--navy); }
    .setting-option span { color:var(--muted); font-size:13px; line-height:1.55; }
    .setting-actions { display:flex; justify-content:flex-end; }
    @media (max-width:680px) {
      .shell { padding-top:14px; }
      .topbar { align-items:flex-start; }
      .viewer span { display:none; }
      .toolbar,.manual-form { grid-template-columns:1fr; }
      .message-head { display:block; }
      time { display:block; margin-top:4px; }
      .person { grid-template-columns:40px minmax(0,1fr); }
      .person .button { grid-column:1 / -1; }
      .setting-options { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">客</div>
        <div>
          <h1>客服(LIFF) 管理中心</h1>
          <p class="subtitle">僅限授權管理者查看</p>
        </div>
      </div>
      <div id="viewer" class="viewer" hidden>
        <span id="viewerName"></span>
        <img id="viewerImage" alt="管理者頭像">
      </div>
    </header>

    <nav class="tabs" aria-label="管理中心分頁">
      <button class="tab active" type="button" data-tab="messages">對話紀錄</button>
      <button class="tab" type="button" data-tab="permissions">管理員權限</button>
      <button class="tab" type="button" data-tab="settings">首頁設定</button>
    </nav>

    <section id="messagesPanel" class="tab-panel">
      <section class="panel toolbar" aria-label="查詢工具">
        <input id="searchInput" type="search" placeholder="搜尋訊息、使用者或群組">
        <select id="typeFilter" aria-label="選擇對話類型">
          <option value="">全部類型</option>
          <option value="user">私訊</option>
          <option value="group">群組</option>
        </select>
        <select id="conversationFilter" aria-label="選擇對話"><option value="">全部對話</option></select>
        <button id="refreshButton" class="button" type="button">重新整理</button>
      </section>
      <p id="messageStatus" class="status">正在驗證 LINE 管理者身分…</p>
      <p id="messageCount" class="count-line" hidden></p>
      <section id="messageList" class="panel message-list" aria-live="polite"></section>
      <div class="footer-actions"><button id="loadMoreButton" class="button" type="button" hidden>載入更多</button></div>
    </section>

    <section id="permissionsPanel" class="tab-panel" hidden>
      <p id="permissionStatus" class="status" hidden></p>
      <div class="permissions-grid">
        <section class="panel permissions-panel">
          <div class="section-head">
            <div><h2>目前管理員</h2><div class="hint">不能移除自己，也不能刪除最後一位管理員。</div></div>
            <span id="adminCount" class="badge-count">0</span>
          </div>
          <div id="adminList" class="people"></div>
        </section>

        <section class="panel permissions-panel">
          <div class="section-head">
            <div><h2>加入管理員</h2><div class="hint">可從曾經私訊或在群組發言的人員中加入，也可直接貼上 LINE UID。</div></div>
            <span id="candidateCount" class="badge-count">0</span>
          </div>
          <form id="manualForm" class="manual-form">
            <input id="uidInput" required placeholder="LINE UID，例如 Uxxxxxxxx…" aria-label="LINE UID">
            <input id="nameInput" placeholder="顯示名稱（選填）" aria-label="顯示名稱">
            <button class="button" type="submit">加入</button>
          </form>
          <input id="candidateSearch" class="candidate-search" type="search" placeholder="搜尋姓名或 UID">
          <div id="candidateList" class="people"></div>
        </section>
      </div>
    </section>

    <section id="settingsPanel" class="tab-panel" hidden>
      <p id="settingStatus" class="status" hidden></p>
      <form id="settingForm" class="panel settings-panel">
        <div>
          <h2>預設首頁模式</h2>
          <div class="hint">設定使用者從 LINE 開啟服務查詢時，預設先看到哪一種操作方式。</div>
        </div>
        <div class="setting-options">
          <label class="setting-option">
            <input type="radio" name="homeMode" value="conversation">
            <strong>對話引導</strong>
            <span>以逐步對話及按鈕，引導使用者找到問題與答案。</span>
          </label>
          <label class="setting-option">
            <input type="radio" name="homeMode" value="faq">
            <strong>問答集模式</strong>
            <span>直接瀏覽分類、搜尋問題並展開查看答案。</span>
          </label>
        </div>
        <div class="setting-actions"><button id="saveSettingButton" class="button" type="submit">儲存設定</button></div>
      </form>
    </section>
  </main>

  <script>
    const LIFF_ID = "2011870813-C7Krkv36";
    const API_BASE = "https://customer-liff-webhook.rogeryuan1981.workers.dev";
    const state = {
      messages:[], nextBefore:null, idToken:null, loading:false,
      viewerUserId:null, admins:[], candidates:[], adminBusy:false, adminsLoaded:false, settingsLoaded:false,
    };
    const elements = {
      tabs:[...document.querySelectorAll("[data-tab]")],
      messagesPanel:document.querySelector("#messagesPanel"), permissionsPanel:document.querySelector("#permissionsPanel"), settingsPanel:document.querySelector("#settingsPanel"),
      viewer:document.querySelector("#viewer"), viewerName:document.querySelector("#viewerName"), viewerImage:document.querySelector("#viewerImage"),
      messageStatus:document.querySelector("#messageStatus"), messageCount:document.querySelector("#messageCount"), messageList:document.querySelector("#messageList"),
      search:document.querySelector("#searchInput"), type:document.querySelector("#typeFilter"), conversation:document.querySelector("#conversationFilter"),
      refresh:document.querySelector("#refreshButton"), loadMore:document.querySelector("#loadMoreButton"),
      permissionStatus:document.querySelector("#permissionStatus"), adminCount:document.querySelector("#adminCount"), candidateCount:document.querySelector("#candidateCount"),
      adminList:document.querySelector("#adminList"), candidateList:document.querySelector("#candidateList"), manualForm:document.querySelector("#manualForm"),
      uid:document.querySelector("#uidInput"), name:document.querySelector("#nameInput"), candidateSearch:document.querySelector("#candidateSearch"),
      settingStatus:document.querySelector("#settingStatus"), settingForm:document.querySelector("#settingForm"), saveSetting:document.querySelector("#saveSettingButton"),
    };

    function setStatus(element, message, error=false) {
      element.textContent = message;
      element.classList.toggle("error", error);
      element.hidden = !message;
    }
    function apiError(code) {
      return ({
        invalid_token:"LINE 登入已失效，請關閉頁面後重新開啟。",
        forbidden:"此 LINE 帳號沒有管理權限。",
        invalid_user_id:"LINE UID 格式不正確。",
        self_removal_not_allowed:"不能移除目前登入的管理員帳號。",
        last_admin:"不能移除最後一位管理員。",
        admin_not_found:"找不到這位管理員。",
        invalid_home_mode:"首頁模式設定不正確。",
        settings_unavailable:"目前無法讀取首頁設定，請確認 D1 migration 已完成。",
      })[code] || "操作失敗，請稍後再試。";
    }
    async function api(path, options={}) {
      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers:{ Authorization:`Bearer ${state.idToken}`, ...(options.body ? {"Content-Type":"application/json"} : {}), ...(options.headers || {}) },
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(apiError(data.error));
      return data;
    }
    function formatTime(timestamp) {
      return new Intl.DateTimeFormat("zh-TW", { timeZone:"Asia/Taipei", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false }).format(new Date(Number(timestamp)));
    }
    function typeLabel(type) {
      return ({ image:"圖片", video:"影片", audio:"語音", file:"檔案", location:"位置", sticker:"貼圖" })[type] || `非文字訊息：${type}`;
    }
    function avatar(person, pictureKey="picture_url", nameKey="display_name") {
      if (person[pictureKey]) {
        const image=document.createElement("img"); image.className="avatar"; image.src=person[pictureKey]; image.alt=""; return image;
      }
      const fallback=document.createElement("div"); fallback.className="avatar"; fallback.textContent=(person[nameKey] || "?").slice(0,1); return fallback;
    }
    function createMessage(item) {
      const article=document.createElement("article"); article.className="message";
      article.appendChild(avatar(item,"sender_picture_url","sender_name"));
      const body=document.createElement("div"), head=document.createElement("div"); head.className="message-head";
      const identity=document.createElement("div"), sender=document.createElement("div"); sender.className="sender"; sender.textContent=item.sender_name || "未知使用者";
      const conversation=document.createElement("div"); conversation.className="conversation";
      const kind=document.createElement("span"); kind.className="kind"; kind.textContent=item.conversation_type === "user" ? "私訊" : "群組"; conversation.appendChild(kind);
      if (item.conversation_type === "group") { const name=document.createElement("span"); name.textContent=item.conversation_name || item.group_name || "未知群組"; conversation.appendChild(name); }
      identity.append(sender,conversation);
      const time=document.createElement("time"); time.dateTime=new Date(Number(item.sent_at)).toISOString(); time.textContent=formatTime(item.sent_at);
      head.append(identity,time); body.appendChild(head);
      if (item.message_type === "text") { const text=document.createElement("p"); text.className="message-text"; text.textContent=item.message_text || ""; body.appendChild(text); }
      else { const label=document.createElement("span"); label.className="message-type"; label.textContent=typeLabel(item.message_type); body.appendChild(label); }
      article.appendChild(body); return article;
    }
    function updateConversationFilter() {
      const selected=elements.conversation.value;
      const conversations=[...new Map(state.messages.map((item)=>[
        `${item.conversation_type}:${item.conversation_id}`,
        item.conversation_type === "user" ? `私訊｜${item.sender_name || "未知使用者"}` : `群組｜${item.conversation_name || item.group_name || "未知群組"}`
      ])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),"zh-Hant"));
      elements.conversation.replaceChildren();
      const all=document.createElement("option"); all.value=""; all.textContent="全部對話"; elements.conversation.appendChild(all);
      for (const [id,name] of conversations) { const option=document.createElement("option"); option.value=id; option.textContent=name; elements.conversation.appendChild(option); }
      elements.conversation.value=conversations.some(([id])=>id===selected) ? selected : "";
    }
    function renderMessages() {
      const keyword=elements.search.value.trim().toLocaleLowerCase("zh-Hant"), type=elements.type.value, conversationId=elements.conversation.value;
      const filtered=state.messages.filter((item)=>{
        const matchesType=!type || item.conversation_type===type;
        const matchesConversation=!conversationId || `${item.conversation_type}:${item.conversation_id}`===conversationId;
        const haystack=[item.conversation_name,item.group_name,item.sender_name,item.message_text].filter(Boolean).join(" ").toLocaleLowerCase("zh-Hant");
        return matchesType && matchesConversation && (!keyword || haystack.includes(keyword));
      });
      elements.messageList.replaceChildren(); elements.messageCount.hidden=false;
      elements.messageCount.textContent=`目前顯示 ${filtered.length} 筆；已載入 ${state.messages.length} 筆紀錄`;
      if (!filtered.length) { const empty=document.createElement("div"); empty.className="empty"; empty.textContent=state.messages.length ? "找不到符合的訊息" : "目前沒有客服對話"; elements.messageList.appendChild(empty); return; }
      const fragment=document.createDocumentFragment(); filtered.forEach((item)=>fragment.appendChild(createMessage(item))); elements.messageList.appendChild(fragment);
    }
    async function loadMessages({reset=false}={}) {
      if (state.loading) return;
      state.loading=true; elements.refresh.disabled=true; elements.loadMore.disabled=true;
      setStatus(elements.messageStatus,reset ? "正在重新整理客服紀錄…" : "正在載入客服紀錄…");
      try {
        const url=new URL(`${API_BASE}/api/messages`); url.searchParams.set("limit","100"); if (!reset && state.nextBefore) url.searchParams.set("before",state.nextBefore);
        const data=await api(`${url.pathname}${url.search}`);
        if (reset) state.messages=[];
        const known=new Set(state.messages.map((item)=>item.id)); state.messages.push(...data.items.filter((item)=>!known.has(item.id))); state.nextBefore=data.nextBefore;
        elements.viewer.hidden=false; elements.viewerName.textContent=data.viewer.displayName || "管理者";
        if (data.viewer.pictureUrl) { elements.viewerImage.src=data.viewer.pictureUrl; elements.viewerImage.hidden=false; } else elements.viewerImage.hidden=true;
        updateConversationFilter(); renderMessages(); elements.loadMore.hidden=!state.nextBefore; setStatus(elements.messageStatus,"");
      } catch (error) { setStatus(elements.messageStatus,error.message,true); }
      finally { state.loading=false; elements.refresh.disabled=false; elements.loadMore.disabled=false; }
    }
    function personRow(person,isAdmin) {
      const row=document.createElement("div"); row.className="person"; row.appendChild(avatar(person));
      const info=document.createElement("div"), name=document.createElement("div"); name.className="name"; name.textContent=person.display_name || "未命名使用者";
      if (person.user_id===state.viewerUserId) { const self=document.createElement("span"); self.className="self"; self.textContent="目前帳號"; name.appendChild(self); }
      const uid=document.createElement("div"); uid.className="uid"; uid.textContent=person.user_id; info.append(name,uid); row.appendChild(info);
      const button=document.createElement("button"); button.type="button"; button.className=isAdmin ? "button danger" : "button secondary"; button.textContent=isAdmin ? "移除權限" : "加入管理員";
      button.disabled=state.adminBusy || (isAdmin && person.user_id===state.viewerUserId); button.addEventListener("click",()=>isAdmin ? removeAdmin(person) : addAdmin(person)); row.appendChild(button); return row;
    }
    function renderAdmins() {
      elements.adminCount.textContent=state.admins.length; elements.candidateCount.textContent=state.candidates.length;
      elements.adminList.replaceChildren(); elements.candidateList.replaceChildren(); state.admins.forEach((person)=>elements.adminList.appendChild(personRow(person,true)));
      const keyword=elements.candidateSearch.value.trim().toLocaleLowerCase("zh-Hant");
      const filtered=state.candidates.filter((person)=>[person.display_name,person.user_id].filter(Boolean).join(" ").toLocaleLowerCase("zh-Hant").includes(keyword));
      if (!filtered.length) { const empty=document.createElement("div"); empty.className="empty"; empty.textContent=state.candidates.length ? "找不到符合的人員" : "目前沒有可加入的人員"; elements.candidateList.appendChild(empty); }
      else filtered.forEach((person)=>elements.candidateList.appendChild(personRow(person,false)));
    }
    async function loadAdmins() {
      setStatus(elements.permissionStatus,"正在載入管理員名單…");
      try {
        const data=await api("/api/admins"); state.viewerUserId=data.viewerUserId; state.admins=data.admins || []; state.candidates=data.candidates || []; state.adminsLoaded=true; renderAdmins(); setStatus(elements.permissionStatus,"");
      } catch (error) { setStatus(elements.permissionStatus,error.message,true); }
    }
    async function addAdmin(person) {
      if (state.adminBusy) return false;
      state.adminBusy=true; renderAdmins();
      try { await api("/api/admins",{method:"POST",body:JSON.stringify({userId:person.user_id,displayName:person.display_name || ""})}); await loadAdmins(); return true; }
      catch (error) { setStatus(elements.permissionStatus,error.message,true); return false; }
      finally { state.adminBusy=false; renderAdmins(); }
    }
    async function removeAdmin(person) {
      if (state.adminBusy || person.user_id===state.viewerUserId) return;
      if (!confirm(`確定移除「${person.display_name || person.user_id}」的管理權限嗎？`)) return;
      state.adminBusy=true; renderAdmins();
      try { await api(`/api/admins/${encodeURIComponent(person.user_id)}`,{method:"DELETE"}); await loadAdmins(); }
      catch (error) { setStatus(elements.permissionStatus,error.message,true); }
      finally { state.adminBusy=false; renderAdmins(); }
    }
    async function loadSettings() {
      setStatus(elements.settingStatus,"正在讀取首頁設定…");
      try {
        const data=await api("/api/settings");
        const input=elements.settingForm.querySelector(`input[name="homeMode"][value="${data.homeMode}"]`);
        if (input) input.checked=true;
        state.settingsLoaded=true;
        setStatus(elements.settingStatus,"");
      } catch (error) { setStatus(elements.settingStatus,error.message,true); }
    }
    async function saveSettings(event) {
      event.preventDefault();
      const homeMode=new FormData(elements.settingForm).get("homeMode");
      if (!homeMode) { setStatus(elements.settingStatus,"請先選擇首頁模式。",true); return; }
      elements.saveSetting.disabled=true; setStatus(elements.settingStatus,"正在儲存首頁設定…");
      try {
        await api("/api/settings",{method:"PUT",body:JSON.stringify({homeMode})});
        setStatus(elements.settingStatus,"設定已儲存；使用者下次從 LINE 開啟時就會套用。",false);
      } catch (error) { setStatus(elements.settingStatus,error.message,true); }
      finally { elements.saveSetting.disabled=false; }
    }
    async function showTab(name) {
      elements.tabs.forEach((tab)=>tab.classList.toggle("active",tab.dataset.tab===name));
      elements.messagesPanel.hidden=name!=="messages"; elements.permissionsPanel.hidden=name!=="permissions"; elements.settingsPanel.hidden=name!=="settings";
      if (name==="permissions" && !state.adminsLoaded) await loadAdmins();
      if (name==="settings" && !state.settingsLoaded) await loadSettings();
    }
    elements.tabs.forEach((tab)=>tab.addEventListener("click",()=>showTab(tab.dataset.tab)));
    elements.search.addEventListener("input",renderMessages); elements.type.addEventListener("change",renderMessages); elements.conversation.addEventListener("change",renderMessages);
    elements.refresh.addEventListener("click",()=>loadMessages({reset:true})); elements.loadMore.addEventListener("click",()=>loadMessages()); elements.candidateSearch.addEventListener("input",renderAdmins);
    elements.manualForm.addEventListener("submit",async(event)=>{ event.preventDefault(); const success=await addAdmin({user_id:elements.uid.value.trim(),display_name:elements.name.value.trim()}); if (success) { elements.uid.value=""; elements.name.value=""; } });
    elements.settingForm.addEventListener("submit",saveSettings);
    async function start() {
      if (LIFF_ID==="YOUR_LIFF_ID") { setStatus(elements.messageStatus,"請先將 admin.html 裡的 YOUR_LIFF_ID 改成目前使用的 LIFF ID。",true); return; }
      try {
        await liff.init({liffId:LIFF_ID});
        if (!liff.isLoggedIn()) { liff.login({redirectUri:location.href}); return; }
        state.idToken=liff.getIDToken(); if (!state.idToken) throw new Error("無法取得 LINE 登入資訊。");
        await loadMessages({reset:true});
      } catch (error) { setStatus(elements.messageStatus,error.message || "無法開啟客服管理中心。",true); }
    }
    start();
  </script>
</body>
</html>
